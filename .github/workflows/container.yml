name: Container CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm install --global pnpm@12.3.4
          pnpm install --frozen-lockfile

      - name: Type check
        run: npx next typegen && npx tsc --noEmit

      - name: Lint (errors fail, warnings don't)
        run: npx eslint --quiet

      - name: Unit tests
        run: npm test

  integration:
    needs: checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: biborto
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/biborto
      SUPERADMIN_PASSWORD: ci-only-Password-123
      AUTH_SECRET: ci-only-secret
      AUTH_URL: http://localhost:3000
      APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm install --global pnpm@12.3.4
          pnpm install --frozen-lockfile
          sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Seed the database from db/schema.sql and db/seed_*.sql
        run: npm run db:seed

      - name: Database invariant and rate-limit tests
        run: npm run test:integration

      - name: Build and start the app
        run: |
          npm run build
          nohup npx next start > ../next.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3000/robots.txt && break; sleep 2; done

      - name: Smoke tests
        run: npm run test:smoke

      - name: Server log (on failure)
        if: failure()
        run: cat ../next.log || true

  build:
    needs: [checks, integration]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build pull request image
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and publish main image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/biborto:main
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/biborto:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
